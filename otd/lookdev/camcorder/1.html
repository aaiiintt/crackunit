     White ground. The DV frame at full width, cropped off the top of the card

  .dv { position: absolute; left: 0; top: -250px; width: 1080px; height: 810px; overflow: hidden; background: #000; }
  .dv img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .dv .odd { transform: translateX(6px); -webkit-mask-image: repeating-linear-gradient(#000 0 2px, transparent 2px 4px); mask-image: repeating-linear-gradient(#000 0 2px, transparent 2px 4px); }

  .osd { position: absolute; font: 40px/1 "VCR OSD Mono"; color: #fff; letter-spacing: .02em;

  .osd.rec { left: 60px; top: 60px; }
  .osd.rec i { display: inline-block; width: 30px; height: 30px; border-radius: 50%; background: #FF1E00; vertical-align: -2px; margin-left: 18px; box-shadow: 0 0 0 3px #000; }
